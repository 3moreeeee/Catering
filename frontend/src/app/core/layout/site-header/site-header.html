<ng-container *transloco="let t">
  <div class="header__bar">
    <div class="header__inner container--wide">
      <!-- Logo -->
      <a class="header__logo" [routerLink]="home()" [attr.aria-label]="t('meta.siteName')">
        <img
          class="header__logo-mark"
          src="/img/logo-on-light.png"
          width="700"
          height="157"
          fetchpriority="high"
          decoding="sync"
          [alt]="t('meta.siteName')"
        />
        <img
          class="header__logo-mark header__logo-mark--dark"
          src="/img/logo-on-dark.png"
          width="700"
          height="157"
          alt=""
          aria-hidden="true"
        />
      </a>

      <!-- Search is a real GET form pointed at the catalogue, which already
           owns search and URL-synced filters. It submits without JavaScript. -->
      <form
        class="header__search"
        role="search"
        method="get"
        [attr.action]="searchAction()"
        (submit)="submitSearch($event, searchInput.value)"
      >
        <label class="u-visually-hidden" for="fk-header-search">{{ t('search.open') }}</label>
        <svg
          class="header__search-icon"
          width="18"
          height="18"
          viewBox="0 0 18 18"
          aria-hidden="true"
        >
          <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path
            d="M12.5 12.5L16 16"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
        <input
          #searchInput
          id="fk-header-search"
          class="header__search-input"
          type="search"
          name="q"
          autocomplete="off"
          [placeholder]="t('search.headerPlaceholder')"
        />
      </form>

      <!-- Actions -->
      <div class="header__actions">
        <!-- On phones the field would crowd the bar, so the same destination
             is offered as an icon link to the catalogue. -->
        <a
          class="btn btn--icon header__search-link"
          [routerLink]="to('products')"
          [attr.aria-label]="t('search.open')"
        >
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path
              d="M12.5 12.5L16 16"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </a>

        <!-- Language switcher: a real link, so it works before hydration and
             search engines can follow it to the alternate locale. -->
        <a
          class="header__lang"
          [href]="switchLocaleUrl(alternate())"
          [attr.hreflang]="alternate()"
          [attr.aria-label]="t('language.switchTo', { language: t('language.' + alternate()) })"
        >
          <span aria-hidden="true">{{ alternate() | uppercase }}</span>
        </a>

        <a class="header__account" [routerLink]="accountPath()">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <circle
              cx="10"
              cy="6.5"
              r="3.25"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path
              d="M3.5 17c.45-3.25 2.62-5 6.5-5s6.05 1.75 6.5 5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          <span class="header__account-label">{{ t('nav.account') }}</span>
        </a>

        <!-- The basket is available to clients and administrators. -->
        <a
          class="btn btn--icon header__cart"
          [routerLink]="to('cart')"
          [attr.aria-label]="
            cart.itemCount() > 0 ? t('nav.cartCount', { count: cart.itemCount() }) : t('nav.cart')
          "
        >
          <svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M2.5 3h2l2 9.5h9l2-6.5H6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="8" cy="16" r="1.25" fill="currentColor" />
            <circle cx="14.5" cy="16" r="1.25" fill="currentColor" />
          </svg>
          <span class="header__cart-count" aria-hidden="true">{{ cart.itemCount() }}</span>
        </a>

        <button
          #burger
          type="button"
          class="btn btn--icon header__burger"
          [attr.aria-label]="mobileOpen() ? t('nav.closeMenu') : t('nav.openMenu')"
          [attr.aria-expanded]="mobileOpen()"
          aria-controls="fk-mobile-nav"
          (click)="toggleMobile()"
        >
          <span class="header__burger-lines" [class.is-open]="mobileOpen()" aria-hidden="true">
            <span></span><span></span>
          </span>
        </button>
      </div>
    </div>

    <!-- Desktop navigation -->
    <nav class="header__nav container--wide" [attr.aria-label]="t('nav.mainNavigation')">
      <ul class="header__nav-list">
        <li>
          <a
            class="header__nav-link"
            [routerLink]="home()"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
            >{{ t('nav.home') }}</a
          >
        </li>
        <li class="header__nav-item--mega">
          <button
            type="button"
            class="header__nav-link header__nav-trigger"
            [attr.aria-expanded]="megaOpen()"
            aria-haspopup="true"
            aria-controls="fk-mega-menu"
            (click)="toggleMega()"
          >
            {{ t('nav.catalogue') }}
            <svg
              class="header__chevron"
              width="10"
              height="6"
              viewBox="0 0 10 6"
              aria-hidden="true"
            >
              <path
                d="M1 1l4 4 4-4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </li>
        <li>
          <a class="header__nav-link" [routerLink]="to('brands')" routerLinkActive="is-active">{{
            t('nav.ourBrands')
          }}</a>
        </li>
        <li>
          <a class="header__nav-link" [routerLink]="to('about')" routerLinkActive="is-active">{{
            t('nav.company')
          }}</a>
        </li>
        <li>
          <a class="header__nav-link" [routerLink]="to('contact')" routerLinkActive="is-active">{{
            t('nav.contact')
          }}</a>
        </li>
      </ul>
    </nav>
  </div>

  <!-- Mega menu -->
  @if (megaOpen()) {
    <fk-mega-menu
      id="fk-mega-menu"
      [categories]="categories()"
      [productCount]="productCount()"
      (dismiss)="closeMega()"
    />
  }

  <!-- Mobile drawer -->
  <fk-mobile-nav
    id="fk-mobile-nav"
    [open]="mobileOpen()"
    [categories]="categories()"
    (dismiss)="toggleMobile()"
  />
</ng-container>
